<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>POS Toko Sembako</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: Arial, sans-serif; background:#f5f6fa; margin:0; padding:0; }
    header { background:#0055aa; color:#fff; display:flex; justify-content:space-between; align-items:center; padding:10px 20px; }
    header h1 { margin:0; font-size:20px; }
    header .cart-info { font-size:14px; }
    main { display:flex; gap:20px; padding:20px; }
    section.dashboard { flex:3; background:#fff; padding:15px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    aside { flex:1; display:flex; flex-direction:column; gap:15px; }
    .card { background:#fff; padding:15px; border-radius:8px; box-shadow:0 0 10px rgba(0,0,0,0.1); }
    .tab-menu { display:flex; gap:5px; margin-bottom:10px; }
    .tab-menu button { padding:6px 10px; border:none; background:#e0e0e0; cursor:pointer; border-radius:4px; }
    .tab-menu button.active { background:#0055aa; color:#fff; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    table th, table td { border-bottom:1px solid #ddd; padding:6px; text-align:left; }
    input, select { width:100%; padding:6px; margin-top:5px; margin-bottom:5px; font-size:14px; }
    button.small { padding:4px 8px; font-size:13px; cursor:pointer; }
    button.small.ghost { background:#ccc; }
    button { background:#0055aa; color:#fff; border:none; padding:6px 12px; cursor:pointer; border-radius:4px; }
    button:hover { opacity:0.9; }
  </style>
</head>
<body>
  <header>
    <h1>POS Toko Sembako</h1>
    <div class="cart-info">
      <span id="cart-count">Keranjang: 0 barang</span>
      <span id="status-info">Offline</span>
    </div>
  </header>

  <main>
    <!-- ===========================
         DASHBOARD
    ============================ -->
    <section class="dashboard">
      <div class="tab-menu">
        <button id="tab-penjualan" class="active" onclick="showTab('penjualan')">Penjualan</button>
        <button id="tab-restock" onclick="showTab('restock')">Restock</button>
        <button id="tab-stok" onclick="showTab('stok')">Stok Akhir</button>
      </div>

      <div class="tab-content" id="content-penjualan">
        <h3>Laporan Penjualan</h3>
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Tanggal</th>
              <th>Invoice</th>
              <th>Item</th>
              <th>Total</th>
            </tr>
          </thead>
          <tbody id="table-penjualan"></tbody>
        </table>
      </div>

      <div class="tab-content" id="content-restock" style="display:none;">
        <h3>Laporan Restock</h3>
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>Tanggal</th>
              <th>SKU</th>
              <th>Nama</th>
              <th>Jumlah</th>
              <th>Stok Akhir</th>
            </tr>
          </thead>
          <tbody id="table-restock"></tbody>
        </table>
      </div>

      <div class="tab-content" id="content-stok" style="display:none;">
        <h3>Stok Akhir Produk</h3>
        <table>
          <thead>
            <tr>
              <th>No</th>
              <th>SKU</th>
              <th>Nama</th>
              <th>Stok</th>
              <th>Harga</th>
            </tr>
          </thead>
          <tbody id="table-stok"></tbody>
        </table>
      </div>
    </section>

    <!-- ===========================
         SIDEBAR
    ============================ -->
    <aside>
      <div class="card">
        <h4>Tambah / Edit Produk</h4>
        <input type="text" id="sku" placeholder="Kode Barang" />
        <button type="button" class="small" onclick="startScan('sku')">Scan</button>
        <input type="text" id="name" placeholder="Nama Produk" />
        <input type="number" id="price" placeholder="Harga Jual (Rp)" />
        <input type="number" id="stock" placeholder="Stok (angka)" />
        <button id="add-product">Simpan</button>
      </div>

      <div class="card">
        <h4>Restock Produk</h4>
        <select id="restock-product"></select>
        <input type="number" id="restock-qty" placeholder="Jumlah Restock" />
        <button id="btn-restock">Tambah Stok</button>
      </div>

      <div class="card">
        <h4>Daftar Produk</h4>
        <input type="text" id="search-product" placeholder="Cari produk (Kode/Nama)..." />
        <div style="max-height:150px;overflow:auto;">
          <table>
            <thead>
              <tr>
                <th>SKU</th>
                <th>Nama</th>
                <th>Stok</th>
              </tr>
            </thead>
            <tbody id="product-list"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h4>Scan Produk Jual</h4>
        <button class="small" onclick="startScan('sell')">Mulai Scan Jual</button>
        <button class="small ghost" onclick="stopScan()">Stop Scan</button>
        <br/>
        <label><input type="checkbox" id="autoSell"> Auto-sell</label>
        <select id="scanMode">
          <option value="single">1x auto-stop</option>
          <option value="continuous">Scan terus</option>
        </select>
        <p id="cart-info"><i>Keranjang kosong</i></p>
      </div>
    </aside>
  </main>

  <!-- ===========================
       MODAL SCANNER POPUP
  ============================ -->
  <div id="cameraModal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);align-items:center;justify-content:center;z-index:9999;">
    <div style="background:#fff;padding:15px;border-radius:10px;max-width:400px;width:90%;">
      <div id="readerPopup" style="width:100%;height:300px;background:#000;border-radius:8px;"></div>
      <div style="margin-top:10px;display:flex;justify-content:space-between;">
        <button onclick="stopScan()" class="small ghost">Stop Scan</button>
        <button onclick="closeCameraModal()" class="small">Tutup</button>
      </div>
    </div>
  </div>

  <!-- ===========================
       SCRIPT FITUR
  ============================ -->
  <script>
    const tabPenjualan = document.getElementById('tab-penjualan');
    const tabRestock = document.getElementById('tab-restock');
    const tabStok = document.getElementById('tab-stok');
    const contentPenjualan = document.getElementById('content-penjualan');
    const contentRestock = document.getElementById('content-restock');
    const contentStok = document.getElementById('content-stok');

    function showTab(tab) {
      tabPenjualan.classList.remove('active');
      tabRestock.classList.remove('active');
      tabStok.classList.remove('active');
      contentPenjualan.style.display = 'none';
      contentRestock.style.display = 'none';
      contentStok.style.display = 'none';
      if (tab === 'penjualan') {
        tabPenjualan.classList.add('active');
        contentPenjualan.style.display = 'block';
      } else if (tab === 'restock') {
        tabRestock.classList.add('active');
        contentRestock.style.display = 'block';
      } else {
        tabStok.classList.add('active');
        contentStok.style.display = 'block';
      }
    }

    // contoh fungsi addToCart
    function addToCart(sku) {
      console.log("Produk masuk keranjang:", sku);
      document.getElementById('cart-info').innerHTML = 'Produk ' + sku + ' ditambahkan ke keranjang.';
    }
  </script>

  <!-- ===========================
       SCRIPT SCANNER POPUP
  ============================ -->
  <script>
    let html5QrcodeScannerPopup = null;
    let scanTarget = null;

    function startScan(target) {
      scanTarget = target;
      openCameraModal();

      if (html5QrcodeScannerPopup) return;
      html5QrcodeScannerPopup = new Html5Qrcode("readerPopup");
      const config = { fps: 10, qrbox: 250 };

      html5QrcodeScannerPopup.start({ facingMode: "environment" }, config, (msg) => {
        handleScan(msg);
        if (document.getElementById("scanMode").value === "single" && document.getElementById("autoSell").checked) {
          stopScan();
          closeCameraModal();
        }
      }).catch((err) => {
        console.error(err);
        alert("Gagal mengakses kamera: " + err);
      });
    }

    function stopScan() {
      if (html5QrcodeScannerPopup) {
        html5QrcodeScannerPopup.stop().catch(()=>{}).then(()=>{
          html5QrcodeScannerPopup = null;
        });
      }
    }

    function handleScan(msg) {
      if (scanTarget === "sell" || document.getElementById("autoSell").checked) {
        addToCart(msg);
      } else {
        document.getElementById("sku").value = msg;
        alert("Kode Barang terdeteksi: " + msg);
      }
    }

    function openCameraModal() {
      document.getElementById("cameraModal").style.display = "flex";
    }

    function closeCameraModal() {
      stopScan();
      document.getElementById("cameraModal").style.display = "none";
    }
  </script>
</body>
</html>
