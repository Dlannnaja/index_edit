<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POS Toko Sembako</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    /* Tambahan untuk popup scanner */
    #cameraModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.7);
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
    #cameraModal .popup-box {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      max-width: 400px;
      width: 90%;
    }
    #readerPopup {
      width: 100%;
      height: 300px;
      background: #000;
      border-radius: 8px;
    }
    #cameraModal .popup-actions {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <!-- 🧭 Header -->
  <header>
    <div class="container">
      <h1>POS Toko Sembako</h1>
      <div id="cart-status">Keranjang: 0 barang &nbsp; <span id="status">Offline</span></div>
    </div>
  </header>

  <!-- 🧭 Dashboard -->
  <main>
    <div class="container grid">
      <div class="card">
        <h3><i>📊</i> Dashboard</h3>
        <div class="tab">
          <button class="active" onclick="showTab('penjualan')">Penjualan</button>
          <button onclick="showTab('restock')">Restock</button>
          <button onclick="showTab('stokakhir')">Stok Akhir</button>
        </div>

        <!-- Penjualan -->
        <div id="penjualan" class="tabcontent">
          <h4>Laporan Penjualan</h4>
          <table>
            <thead>
              <tr>
                <th>No</th><th>Tanggal</th><th>Invoice</th><th>Item</th><th>Total</th>
              </tr>
            </thead>
            <tbody id="sales-table"></tbody>
          </table>
        </div>

        <!-- Restock -->
        <div id="restock" class="tabcontent" style="display:none;">
          <h4>Laporan Restock</h4>
          <table>
            <thead>
              <tr>
                <th>No</th><th>Tanggal</th><th>SKU</th><th>Nama</th><th>Jumlah</th><th>Stok Akhir</th>
              </tr>
            </thead>
            <tbody id="restock-table"></tbody>
          </table>
        </div>

        <!-- Stok Akhir -->
        <div id="stokakhir" class="tabcontent" style="display:none;">
          <h4>Stok Akhir Produk</h4>
          <table>
            <thead>
              <tr>
                <th>No</th><th>SKU</th><th>Nama</th><th>Stok</th><th>Harga</th>
              </tr>
            </thead>
            <tbody id="stock-table"></tbody>
          </table>
        </div>
      </div>

      <!-- 🧾 Tambah/Edit Produk -->
      <div class="card">
        <h3>Tambah / Edit Produk</h3>
        <input type="text" id="sku" placeholder="Kode Barang" />
        <button class="small" onclick="startScan('sku')">Scan</button>
        <input type="text" id="name" placeholder="Nama Produk" />
        <input type="number" id="price" placeholder="Harga" />
        <input type="number" id="stock" placeholder="Stok" />
        <button onclick="saveProduct()">Simpan</button>
      </div>

      <!-- 🛒 Keranjang -->
      <div class="card">
        <h3>Scan Produk Jual</h3>
        <button class="small" onclick="startScan('sell')">Mulai Scan Jual</button>
        <button class="small ghost" onclick="stopScan()">Stop Scan</button>
        <div style="margin-top:10px;">
          <label><input type="checkbox" id="autoSell" /> Auto-sell</label>
          <select id="scanMode">
            <option value="single">1x auto-stop</option>
            <option value="continuous">Multi-scan</option>
          </select>
        </div>
        <div id="cart-list" style="margin-top:10px;">
          <em>Keranjang kosong</em>
        </div>
      </div>
    </div>
  </main>

  <!-- 📸 Popup Scanner -->
  <div id="cameraModal">
    <div class="popup-box">
      <div id="readerPopup"></div>
      <div class="popup-actions">
        <button class="small ghost" onclick="stopScan()">Stop Scan</button>
        <button class="small" onclick="closeCameraModal()">Tutup</button>
      </div>
    </div>
  </div>

  <!-- ================= SCRIPT ================= -->
  <script>
    /* 🧭 TAB SWITCHER */
    function showTab(tab) {
      document.querySelectorAll('.tabcontent').forEach(el => el.style.display = 'none');
      document.getElementById(tab).style.display = 'block';
      document.querySelectorAll('.tab button').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
    }

    /* 🧾 PRODUCT LOGIC (dummy contoh minimal) */
    const products = [];
    const cart = [];

    function saveProduct() {
      const sku = skuInput.value.trim();
      const name = document.getElementById('name').value.trim();
      const price = parseFloat(document.getElementById('price').value);
      const stock = parseInt(document.getElementById('stock').value);
      if (!sku || !name || isNaN(price) || isNaN(stock)) return alert("Lengkapi data");

      const exist = products.find(p => p.sku === sku);
      if (exist) {
        exist.stock += stock;
        exist.price = price;
        exist.name = name;
      } else {
        products.push({ sku, name, price, stock });
      }
      alert('Produk disimpan!');
    }

    function addToCart(sku) {
      const product = products.find(p => p.sku === sku);
      if (!product) {
        alert('Produk tidak ditemukan');
        return;
      }
      const exist = cart.find(c => c.sku === sku);
      if (exist) exist.qty++;
      else cart.push({ ...product, qty: 1 });
      renderCart();
    }

    function renderCart() {
      const list = document.getElementById('cart-list');
      if (cart.length === 0) {
        list.innerHTML = '<em>Keranjang kosong</em>';
        return;
      }
      let html = '<ul>';
      let total = 0;
      cart.forEach(item => {
        const subtotal = item.price * item.qty;
        total += subtotal;
        html += `<li>${item.sku} - ${item.name} x${item.qty} (Rp ${subtotal.toLocaleString()})</li>`;
      });
      html += `</ul><strong>Total: Rp ${total.toLocaleString()}</strong>`;
      list.innerHTML = html;
    }

    /* 📸 SCANNER POPUP */
    let html5QrcodeScanner = null;
    let scanTarget = null;

    function startScan(target) {
      scanTarget = target;
      openCameraModal();
      if (html5QrcodeScanner) return;

      html5QrcodeScanner = new Html5Qrcode("readerPopup");
      const config = { fps: 10, qrbox: 250 };

      html5QrcodeScanner.start({ facingMode: "environment" }, config, (msg) => {
        handleScan(msg);
        if (document.getElementById("scanMode").value === "single" && document.getElementById("autoSell").checked) {
          stopScan();
          closeCameraModal();
        }
      }).catch((err) => {
        console.error(err);
        alert("Gagal mengakses kamera: " + err);
      });
    }

    function stopScan() {
      if (html5QrcodeScanner) {
        html5QrcodeScanner.stop().catch(()=>{}).then(()=>{
          html5QrcodeScanner = null;
        });
      }
    }

    function handleScan(msg) {
      if (scanTarget === "sell" || document.getElementById("autoSell").checked) {
        addToCart(msg);
      } else {
        document.getElementById("sku").value = msg;
        alert("Kode Barang terdeteksi: " + msg);
      }
    }

    function openCameraModal() {
      document.getElementById("cameraModal").style.display = "flex";
    }

    function closeCameraModal() {
      stopScan();
      document.getElementById("cameraModal").style.display = "none";
    }
  </script>
</body>
</html>
